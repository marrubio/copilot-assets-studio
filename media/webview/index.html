<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <style>{{STYLE}}</style>
</head>
<body data-fallback-title="{{TITLE}}" data-artifact="{{KIND}}">
  <header class="actions">
    <div class="artifact-identity">
      <span class="artifact-icon" aria-hidden="true">{{ICON}}</span>
      <div class="artifact-heading">
        <span class="artifact-kind">{{KIND_LABEL}} / AI artifact</span>
        <h1>{{TITLE}}</h1>
      </div>
    </div>
    <div class="token-estimate" id="tokenEstimate" title="Approximate tokens for the frontmatter (YAML and delimiters) and Markdown. Actual tokens depend on the model; this is not a price or a full conversation cost."></div>
    <div class="status badge" id="status">Ready</div>
    <button id="sourceButton">Source view</button>
    <button id="saveButton">Save</button>
  </header>
  <main id="artifactRoot"></main>
  <script type="application/json" id="initial-state">{{STATE}}</script>
  <script nonce="{{NONCE}}">
    const vscode = acquireVsCodeApi();
    document.getElementById('sourceButton').addEventListener('click', () => vscode.postMessage({ type: 'openSource' }));
    {{SCRIPT}}
  </script>
</body>
</html>
